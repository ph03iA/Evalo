services:
  evalo-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_STREAM_API_KEY: ${VITE_STREAM_API_KEY}
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${HOST_PORT:-3000}:3000"
    restart: unless-stopped